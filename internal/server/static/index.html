<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClueBot Dashboard</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f1117; color: #e1e4e8; min-height: 100vh; }

/* Login page */
.login-page { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.login-box { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 32px; width: 100%; max-width: 360px; }
.login-box h2 { font-size: 24px; margin-bottom: 8px; text-align: center; }
.login-box p { color: #8b949e; text-align: center; margin-bottom: 24px; font-size: 14px; }
.login-box label { display: block; font-size: 14px; margin-bottom: 6px; color: #c9d1d9; }
.login-box input { width: 100%; padding: 10px 12px; border: 1px solid #30363d; border-radius: 6px; background: #0d1117; color: #e1e4e8; font-size: 14px; margin-bottom: 16px; outline: none; }
.login-box input:focus { border-color: #58a6ff; }
.login-box button { width: 100%; padding: 10px; border: none; border-radius: 6px; background: #238636; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
.login-box button:hover { background: #2ea043; }
.login-error { color: #f85149; font-size: 13px; text-align: center; margin-bottom: 12px; min-height: 20px; }

/* Header */
.header { background: #161b22; padding: 16px 24px; border-bottom: 1px solid #30363d; display: flex; align-items: center; gap: 12px; }
.header h1 { font-size: 20px; font-weight: 600; }
.header .status { width: 10px; height: 10px; border-radius: 50%; background: #3fb950; animation: pulse 2s infinite; }
.header .status.offline { background: #f85149; animation: none; }
.header .status.connecting { background: #4949f8; animation: none; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
.logout-btn { margin-left: auto; background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.logout-btn:hover { background: #30363d; }

/* Dashboard */
.dashboard { display: none; }
.container { max-width: 1200px; margin: 0 auto; padding: 24px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px; }
.card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; }
.card h3 { font-size: 14px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
.card .value { font-size: 36px; font-weight: 700; font-variant-numeric: tabular-nums; }
.card .unit { font-size: 16px; color: #8b949e; margin-left: 4px; }
.card .bar { height: 6px; background: #21262d; border-radius: 3px; margin-top: 12px; overflow: hidden; }
.card .bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
.ok { color: #3fb950; }
.warn { color: #d29922; }
.crit { color: #f85149; }
.load-avg { display: flex; gap: 16px; margin-top: 8px; }
.load-avg span { font-size: 14px; color: #8b949e; }
.incidents { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; }
.incidents h3 { font-size: 14px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
.incident-list { list-style: none; }
.incident-list li { padding: 12px 0; border-bottom: 1px solid #21262d; display: flex; justify-content: space-between; align-items: center; font-size: 14px; cursor: pointer; transition: background 0.15s; padding-left: 8px; padding-right: 8px; border-radius: 4px; }
.incident-list li:hover { background: #1f2937; }
.incident-list li:last-child { border-bottom: none; }
.incident-type { padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
.incident-type.cpu { background: #1f2937; color: #d29922; }
.incident-type.memory { background: #1f2937; color: #f85149; }
.incident-type.disk { background: #1f2937; color: #a371f7; }
.incident-type.restart { background: #1f2937; color: #3fb950; }
.incident-type.service { background: #1f2937; color: #58a6ff; }
.incident-type.process { background: #1f2937; color: #f0883e; }
.incident-time { color: #8b949e; }
.no-incidents { color: #8b949e; text-align: center; padding: 24px; font-size: 14px; }

/* Modal */
.modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; }
.modal-overlay.active { display: flex; }
.modal { background: #161b22; border: 1px solid #30363d; border-radius: 12px; width: 90%; max-width: 640px; max-height: 80vh; overflow: hidden; display: flex; flex-direction: column; }
.modal-header { padding: 20px 24px; border-bottom: 1px solid #30363d; display: flex; align-items: center; justify-content: space-between; }
.modal-header h2 { font-size: 18px; font-weight: 600; }
.modal-close { background: none; border: none; color: #8b949e; font-size: 24px; cursor: pointer; padding: 4px 8px; line-height: 1; }
.modal-close:hover { color: #e1e4e8; }
.modal-body { padding: 24px; overflow-y: auto; }
.detail-section { margin-bottom: 20px; }
.detail-section:last-child { margin-bottom: 0; }
.detail-section h4 { font-size: 13px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
.detail-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; }
.detail-row:not(:last-child) { border-bottom: 1px solid #21262d; }
.detail-label { color: #8b949e; }
.detail-value { font-weight: 500; font-variant-numeric: tabular-nums; }
.service-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; font-size: 14px; }
.service-item:not(:last-child) { border-bottom: 1px solid #21262d; }
.service-active { color: #3fb950; }
.service-inactive { color: #f85149; }
.timestamp { color: #8b949e; font-size: 13px; margin-bottom: 16px; }
.trigger-badge { display: inline-block; padding: 4px 10px; border-radius: 4px; font-size: 13px; font-weight: 600; margin-bottom: 16px; }
.trigger-badge.cpu { background: #2d1f00; color: #d29922; }
.trigger-badge.memory { background: #2d0000; color: #f85149; }
.trigger-badge.disk { background: #1f002d; color: #a371f7; }
.trigger-badge.restart { background: #002d00; color: #3fb950; }
.trigger-badge.service { background: #001a2d; color: #58a6ff; }
.trigger-badge.process { background: #2d1a00; color: #f0883e; }
.service-block { background: #0d1117; border: 1px solid #21262d; border-radius: 6px; padding: 14px; margin-bottom: 12px; }
.service-block:last-child { margin-bottom: 0; }
.service-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 15px; }
.logs-section { margin-top: 10px; }
.logs-section h5 { font-size: 12px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.log-output { background: #161b22; border: 1px solid #30363d; border-radius: 4px; padding: 10px; font-size: 12px; font-family: 'Consolas', 'Monaco', monospace; color: #c9d1d9; overflow-x: auto; white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow-y: auto; line-height: 1.5; }
.alert-box { padding: 10px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; margin: 10px 0; }
.alert-box.crit { background: #2d0000; color: #f85149; border: 1px solid #f8514933; }
.alert-box.warn { background: #2d1f00; color: #d29922; border: 1px solid #d2992233; }
.process-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-size: 13px; border-bottom: 1px solid #21262d; }
.process-row:last-child { border-bottom: none; }
.process-name { color: #c9d1d9; font-family: 'Consolas', 'Monaco', monospace; }
.process-count { color: #8b949e; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<!-- Login Page -->
<div class="login-page" id="login-page">
<div class="login-box">
<h2>ClueBot</h2>
<p>Sign in to access the dashboard</p>
<div class="login-error" id="login-error"></div>
<form id="login-form">
<label for="username">Username</label>
<input type="text" id="username" name="username" required autocomplete="username">
<label for="password">Password</label>
<input type="password" id="password" name="password" required autocomplete="current-password">
<button type="submit">Sign in</button>
</form>
</div>
</div>

<!-- Dashboard -->
<div class="dashboard" id="dashboard">
<div class="header">
<div class="status" id="status"></div>
<h1>ClueBot Dashboard</h1>
<span style="margin-left:auto;color:#8b949e;font-size:14px" id="last-update">Connecting...</span>
<button class="logout-btn" onclick="logout()">Logout</button>
</div>
<div class="container">
<div class="grid">
<div class="card">
<h3>CPU Usage</h3>
<div><span class="value" id="cpu-val">--</span><span class="unit">%</span></div>
<div class="bar"><div class="bar-fill" id="cpu-bar" style="width:0%;background:#3fb950"></div></div>
<div class="load-avg">
<span>1m: <span id="load1">--</span></span>
<span>5m: <span id="load5">--</span></span>
<span>15m: <span id="load15">--</span></span>
</div>
</div>
<div class="card">
<h3>Memory Usage</h3>
<div><span class="value" id="mem-val">--</span><span class="unit">%</span></div>
<div class="bar"><div class="bar-fill" id="mem-bar" style="width:0%;background:#3fb950"></div></div>
<div style="margin-top:8px;font-size:14px;color:#8b949e">
<span id="mem-used">--</span> / <span id="mem-total">--</span> MB
</div>
</div>
<div class="card">
<h3>Disk Usage</h3>
<div><span class="value" id="disk-val">--</span><span class="unit">%</span></div>
<div class="bar"><div class="bar-fill" id="disk-bar" style="width:0%;background:#3fb950"></div></div>
<div style="margin-top:8px;font-size:14px;color:#8b949e">
<span id="disk-used">--</span> / <span id="disk-total">--</span> GB
</div>
</div>
<div class="card">
<h3>Uptime</h3>
<div><span class="value" id="uptime-val">--</span></div>
<div style="margin-top:8px;font-size:14px;color:#8b949e">
Restart detected: <span id="restart-status" class="ok">No</span>
</div>
</div>
</div>
<div class="incidents">
<h3>Recent Incidents</h3>
<ul class="incident-list" id="incident-list">
<li class="no-incidents">No incidents recorded</li>
</ul>
</div>
</div>
</div>

<!-- Incident Detail Modal -->
<div class="modal-overlay" id="modal-overlay">
<div class="modal">
<div class="modal-header">
<h2>Incident Details</h2>
<button class="modal-close" onclick="closeModal()">&times;</button>
</div>
<div class="modal-body" id="modal-body">
</div>
</div>
</div>

<script>
let ws = null;
let reconnectTimer = null;
let incidentsData = [];

// Auth
const sessionKey = 'cluebot_session';

function checkAuth() {
    const token = localStorage.getItem(sessionKey);
    if (!token) {
        showLogin();
        return;
    }
    fetch('/api/verify', { headers: { 'Authorization': 'Bearer ' + token } })
        .then(r => {
            if (r.ok) showDashboard();
            else { localStorage.removeItem(sessionKey); showLogin(); }
        })
        .catch(() => showLogin());
}

function showLogin() {
    document.getElementById('login-page').style.display = 'flex';
    document.getElementById('dashboard').style.display = 'none';
}

function showDashboard() {
    document.getElementById('login-page').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    initDashboard();
}

document.getElementById('login-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const errEl = document.getElementById('login-error');
    errEl.textContent = '';

    fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
    })
    .then(r => r.json())
    .then(data => {
        if (data.token) {
            localStorage.setItem(sessionKey, data.token);
            showDashboard();
        } else {
            errEl.textContent = data.error || 'Invalid credentials';
        }
    })
    .catch(() => { errEl.textContent = 'Connection error'; });
});

function logout() {
    localStorage.removeItem(sessionKey);
    if (ws) ws.close();
    showLogin();
}

function getAuthHeader() {
    const token = localStorage.getItem(sessionKey);
    return token ? { 'Authorization': 'Bearer ' + token } : {};
}

// Dashboard
function initDashboard() {
    connect();
    loadIncidents();
    setInterval(loadIncidents, 30000);
}

function getColor(val) {
    if (val >= 90) return '#f85149';
    if (val >= 70) return '#d29922';
    return '#3fb950';
}

function getClass(val) {
    if (val >= 90) return 'crit';
    if (val >= 70) return 'warn';
    return 'ok';
}

function formatUptime(seconds) {
    const days = Math.floor(seconds / 86400);
    const hours = Math.floor((seconds % 86400) / 3600);
    const mins = Math.floor((seconds % 3600) / 60);
    if (days > 0) return days + 'd ' + hours + 'h';
    if (hours > 0) return hours + 'h ' + mins + 'm';
    return mins + 'm';
}

function updateUI(data) {
    if (data.cpu) {
        const cpu = data.cpu;
        const val = cpu.usage.toFixed(1);
        document.getElementById('cpu-val').textContent = val;
        document.getElementById('cpu-val').className = 'value ' + getClass(cpu.usage);
        document.getElementById('cpu-bar').style.width = cpu.usage + '%';
        document.getElementById('cpu-bar').style.background = getColor(cpu.usage);
        document.getElementById('load1').textContent = cpu.load_avg_1?.toFixed(2) || '--';
        document.getElementById('load5').textContent = cpu.load_avg_5?.toFixed(2) || '--';
        document.getElementById('load15').textContent = cpu.load_avg_15?.toFixed(2) || '--';
    }
    if (data.memory) {
        const mem = data.memory;
        const val = mem.usage.toFixed(1);
        document.getElementById('mem-val').textContent = val;
        document.getElementById('mem-val').className = 'value ' + getClass(mem.usage);
        document.getElementById('mem-bar').style.width = mem.usage + '%';
        document.getElementById('mem-bar').style.background = getColor(mem.usage);
        document.getElementById('mem-used').textContent = mem.used_mb?.toFixed(0) || '--';
        document.getElementById('mem-total').textContent = mem.total_mb?.toFixed(0) || '--';
    }
    if (data.disk) {
        const disk = data.disk;
        if (disk.mounts && disk.mounts.length > 0) {
            const mount = disk.mounts[0];
            const val = mount.usage.toFixed(1);
            document.getElementById('disk-val').textContent = val;
            document.getElementById('disk-val').className = 'value ' + getClass(mount.usage);
            document.getElementById('disk-bar').style.width = mount.usage + '%';
            document.getElementById('disk-bar').style.background = getColor(mount.usage);
            document.getElementById('disk-used').textContent = mount.used_gb?.toFixed(1) || '--';
            document.getElementById('disk-total').textContent = mount.total_gb?.toFixed(1) || '--';
        }
    }
    if (data.restart) {
        const restart = data.restart;
        document.getElementById('uptime-val').textContent = formatUptime(restart.uptime_seconds);
        const el = document.getElementById('restart-status');
        if (restart.alert) {
            el.textContent = 'YES';
            el.className = 'crit';
        } else {
            el.textContent = 'No';
            el.className = 'ok';
        }
    }
    document.getElementById('last-update').textContent = 'Updated: ' + new Date().toLocaleTimeString();
}

function loadIncidents() {
    fetch('/api/incidents', { headers: getAuthHeader() })
        .then(r => r.json())
        .then(data => {
            incidentsData = Array.isArray(data) ? data : [];
            renderIncidentList();
        })
        .catch(() => {});
}

function renderIncidentList() {
    const list = document.getElementById('incident-list');
    if (!incidentsData || incidentsData.length === 0) {
        list.innerHTML = '<li class="no-incidents">No incidents recorded</li>';
        return;
    }
    list.innerHTML = incidentsData.slice(-10).reverse().map((inc, idx) => {
        const time = new Date(inc.time).toLocaleString();
        const type = inc.trigger || inc.type || 'unknown';
        return '<li onclick="showIncidentDetail(' + idx + ')"><span class="incident-type ' + type + '">' + type.toUpperCase() + '</span><span class="incident-time">' + time + '</span></li>';
    }).join('');
}

function showIncidentDetail(idx) {
    const reversed = incidentsData.slice(-10).reverse();
    const inc = reversed[idx];
    if (!inc) return;

    const modal = document.getElementById('modal-body');
    const system = inc.system || {};
    const trigger = inc.trigger || inc.type || 'unknown';
    const time = new Date(inc.time).toLocaleString();

    let html = '<div class="timestamp">' + time + '</div>';
    html += '<span class="trigger-badge ' + trigger + '">' + trigger.toUpperCase() + ' ALERT</span>';

    if (system.cpu) {
        html += '<div class="detail-section"><h4>CPU</h4>';
        html += detailRow('Usage', system.cpu.usage?.toFixed(1) + '%');
        html += detailRow('Load Avg 1m', system.cpu.load_avg_1?.toFixed(2));
        html += detailRow('Load Avg 5m', system.cpu.load_avg_5?.toFixed(2));
        html += detailRow('Load Avg 15m', system.cpu.load_avg_15?.toFixed(2));
        html += '</div>';
    }
    if (system.memory) {
        html += '<div class="detail-section"><h4>Memory</h4>';
        html += detailRow('Usage', system.memory.usage?.toFixed(1) + '%');
        html += detailRow('Used', system.memory.used_mb?.toFixed(0) + ' MB');
        html += detailRow('Total', system.memory.total_mb?.toFixed(0) + ' MB');
        html += detailRow('Available', system.memory.available_mb?.toFixed(0) + ' MB');
        html += detailRow('Swap Used', system.memory.swap_used_mb?.toFixed(1) + ' MB');
        html += '</div>';
    }
    if (system.disk) {
        html += '<div class="detail-section"><h4>Disk</h4>';
        if (system.disk.mounts) {
            system.disk.mounts.forEach(function(m) {
                html += detailRow(m.mount_point, m.usage?.toFixed(1) + '% (' + m.used_gb?.toFixed(1) + ' / ' + m.total_gb?.toFixed(1) + ' GB)');
            });
        }
        html += '</div>';
    }
    if (system.restart) {
        html += '<div class="detail-section"><h4>Uptime</h4>';
        html += detailRow('Current Uptime', formatUptime(system.restart.uptime_seconds));
        html += detailRow('Restart Detected', system.restart.alert ? 'Yes' : 'No');
        html += '</div>';
    }
    if (system.services) {
        html += '<div class="detail-section"><h4>Services</h4>';
        if (system.services.services) {
            system.services.services.forEach(function(s) {
                const statusClass = s.active ? 'service-active' : 'service-inactive';
                const statusText = s.active ? 'Running' : 'Stopped';
                html += '<div class="service-block">';
                html += '<div class="service-header"><strong>' + s.name + '</strong><span class="' + statusClass + '">' + statusText + '</span></div>';
                if (s.state) html += detailRow('State', s.state);
                if (s.sub_state) html += detailRow('Sub State', s.sub_state);
                if (s.loaded) html += detailRow('Loaded', s.loaded);
                if (s.main_pid && s.main_pid !== '0') html += detailRow('Main PID', s.main_pid);
                if (s.exec_start) html += detailRow('ExecStart', s.exec_start);
                if (s.exit_code) html += detailRow('Exit Code', s.exit_code);
                if (s.exit_status) html += detailRow('Exit Status', s.exit_status);
                if (s.status_msg) html += detailRow('Status Message', s.status_msg);
                if (s.active_since) html += detailRow('Active Since', s.active_since);
                if (s.recent_logs && s.recent_logs.length > 0) {
                    html += '<div class="logs-section"><h5>Recent Logs</h5><pre class="log-output">';
                    s.recent_logs.forEach(function(line) {
                        html += escapeHtml(line) + '\n';
                    });
                    html += '</pre></div>';
                }
                html += '</div>';
            });
        }
        html += '</div>';
    }
    if (system.processes) {
        html += '<div class="detail-section"><h4>Process Explosion Detection</h4>';
        html += detailRow('Total Processes', system.processes.total_processes);
        html += detailRow('Baseline Count', system.processes.baseline_count);
        if (system.processes.total_processes > system.processes.baseline_count * 3) {
            html += '<div class="alert-box crit">EXPLOSION DETECTED: ' + system.processes.total_processes + ' processes running (baseline: ' + system.processes.baseline_count + ')</div>';
        }
        if (system.processes.top_processes && system.processes.top_processes.length > 0) {
            html += '<div class="logs-section"><h5>Top Processes by Count</h5>';
            system.processes.top_processes.forEach(function(p) {
                const pct = system.processes.total_processes > 0 ? ((p.count / system.processes.total_processes) * 100).toFixed(1) : 0;
                html += '<div class="process-row"><span class="process-name">' + escapeHtml(p.name) + '</span><span class="process-count">' + p.count + ' (' + pct + '%)</span></div>';
            });
            html += '</div>';
        }
        html += '</div>';
    }

    modal.innerHTML = html;
    document.getElementById('modal-overlay').classList.add('active');
}

function detailRow(label, value) {
    return '<div class="detail-row"><span class="detail-label">' + label + '</span><span class="detail-value">' + value + '</span></div>';
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.appendChild(document.createTextNode(text));
    return div.innerHTML;
}

function closeModal() {
    document.getElementById('modal-overlay').classList.remove('active');
}

document.getElementById('modal-overlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeModal();
});

function connect() {
    console.log('conencting...');
    if (ws) ws.close();
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const token = localStorage.getItem(sessionKey) || '';
    ws = new WebSocket(protocol + '//' + window.location.host + '/ws?token=' + encodeURIComponent(token));
    const statusEl = document.getElementById('status');
    statusEl.className = 'status connecting';
    ws.onopen = () => { statusEl.className = 'status'; };
    ws.onclose = () => {
        statusEl.className = 'status offline';
        document.getElementById('last-update').textContent = 'Disconnected';
        reconnectTimer = setTimeout(connect, 3000);
    };
    ws.onerror = () => { ws.close(); };
    ws.onmessage = (e) => {
        try {
            updateUI(JSON.parse(e.data));
        } catch(err) {}
    };
}

// Init
